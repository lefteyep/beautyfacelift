name: Validate pull request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      WRANGLER_SEND_METRICS: 'false'
      # Public build placeholders only. The local Worker harness blocks outbound services.
      PUBLIC_SUPABASE_URL: https://offline.example.test
      PUBLIC_SUPABASE_ANON_KEY: validation-placeholder
      PUBLIC_TURNSTILE_SITE_KEY: validation-placeholder
      PUBLIC_META_PIXEL_ID: '0000000000000000'
      PUBLIC_GTM_ID: GTM-VALIDATION
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm install --global npm@10.9.9
      - run: npm ci
      - run: npm run validate
