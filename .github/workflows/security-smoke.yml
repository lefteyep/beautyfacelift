name: Security smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Live or staging base URL to verify
        required: false
        default: https://beautyfacelift-zuerich.ch
  schedule:
    # Every Monday 06:00 UTC against production; a failure emails the repository owner.
    - cron: '0 6 * * 1'

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Run security smoke checks
        # Scheduled runs have no inputs, so they fall back to production.
        run: npm run smoke:security -- --base-url "${{ inputs.base_url || 'https://beautyfacelift-zuerich.ch' }}"
